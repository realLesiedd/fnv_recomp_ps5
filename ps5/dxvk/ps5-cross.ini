# Meson cross file: DXVK (d3d9 + PS5 WSI) for a jailbroken PS5.
# Follows the RADV cross file of ps5-plume-triangle / PS5_Vulkan (Mihawk-99).
# Pass the SDK root with: --cross-file ps5/dxvk/sdk.ini (written by ps5/build-dxvk.sh)
[binaries]
c = sdk / 'bin/prospero-clang'
cpp = sdk / 'bin/prospero-clang++'
ar = sdk / 'bin/prospero-ar'
strip = sdk / 'bin/prospero-strip'
pkg-config = sdk / 'bin/prospero-pkg-config'

[host_machine]
system = 'freebsd'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
default_library = 'static'
c_args = ['-Wno-error', '-fno-stack-protector', '-femulated-tls', '-Dstatic_assert=_Static_assert']
cpp_args = ['-Wno-error', '-fno-stack-protector', '-femulated-tls']

[properties]
needs_exe_wrapper = true
